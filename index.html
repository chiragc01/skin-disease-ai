

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skin Disease Prediction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f8fa;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #333;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input[type="file"] {
      margin: 10px 0;
    }
    button {
      background: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>🩺 Skin Disease Prediction</h1>
  <form id="uploadForm">
    <input type="file" id="fileInput" accept="image/*" required><br>
    <button type="submit">Predict</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('uploadForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      resultDiv.innerHTML = "⏳ Predicting... Please wait.";

      try {
        const response = await fetch('https://calcifugous-gunner-posthippocampal.ngrok-free.dev', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error("Server error");

        const data = await response.json();
        resultDiv.innerHTML = `✅ Prediction: <strong>${data.prediction}</strong>`;
      } catch (error) {
        resultDiv.innerHTML = "❌ Error: " + error.message;
      }
    });
  </script>
</body>
</html>

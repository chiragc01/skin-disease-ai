<input type="file" id="imageInput" accept="image/*">
<button onclick="predictDisease()">Predict Disease</button>
<p id="result"></p>

<script>
async function predictDisease() {
  const fileInput = document.getElementById('imageInput');
  const file = fileInput.files[0];
  if (!file) {
    alert("Please select an image first!");
    return;
  }

  const formData = new FormData();
  formData.append('file', file);

  try {
    const response = await fetch("https://skin-disease-ai-8ypl.onrender.com", {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    if (data.predicted_label) {
      document.getElementById('result').innerHTML = `
        🧠 <b>Disease Code:</b> ${data.predicted_label}<br>
        🩺 <b>Name:</b> ${data.full_name}<br>
        📊 <b>Confidence:</b> ${data.confidence.toFixed(2)}%<br>
        ⚠️ <b>Cause:</b> ${data.cause}<br>
        🚫 <b>Habit:</b> ${data.habit}
      `;
    } else {
      document.getElementById('result').innerText = "❌ Error predicting. Please try again.";
    }
  } catch (err) {
    document.getElementById('result').innerText = `⚠️ Network error: ${err.message}`;
  }
}
</script>

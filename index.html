<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skin Disease Predictor</title>
  <style>
    body {
      font-family: Arial;
      margin: 40px;
      background: #f8f9fa;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>
  <h2>🩺 Skin Disease Prediction</h2>
  <form id="uploadForm">
    <input type="file" id="imageInput" accept="image/*" required />
    <button type="submit">Predict</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('uploadForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultDiv.innerHTML = "⏳ Predicting...";

      const fileInput = document.getElementById('imageInput');
      const file = fileInput.files[0];

      if (!file) {
        resultDiv.innerHTML = "❌ Please select an image.";
        return;
      }

      const formData = new FormData();
      formData.append('image', file);

      try {
        const response = await fetch('https://skin-disease-ai-8ypl.onrender.com/', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error("Server error. Try again.");
        }

        const data = await response.json();
        resultDiv.innerHTML = `✅ Predicted Disease: <b>${data.predicted_disease}</b>`;
      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = "❌ Error predicting. Please try again.";
      }
    });
  </script>
</body>
</html>

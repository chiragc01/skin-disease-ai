<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skin Disease Predictor</title>
</head>
<body>
  <h2>Upload an image to predict the disease</h2>
  <input type="file" id="imageUpload" accept="image/*" />
  <button onclick="predict()">Predict</button>
  <div id="result"></div>

  <script>
    async function predict() {
      const fileInput = document.getElementById("imageUpload");
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "⏳ Predicting... please wait...";

      if (!fileInput.files.length) {
        alert("Please upload an image first!");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        const response = await fetch("https://skin-disease-ai-8ypl.onrender.com/predict", {
          method: "POST",
          body: formData,
          mode: "cors"
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Prediction failed");
        }

        resultDiv.innerHTML = `
          <h3>🧠 Predicted Disease: ${data.full_name}</h3>
          <p><b>Label:</b> ${data.predicted_label}</p>
          <p><b>Confidence:</b> ${data.confidence.toFixed(2)}%</p>
          <p><b>Cause:</b> ${data.cause}</p>
          <p><b>Habit:</b> ${data.habit}</p>
        `;
      } catch (error) {
        console.error("Prediction Error:", error);
        resultDiv.innerHTML = `❌ Error predicting: ${error.message}`;
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skin Disease Prediction</title>
</head>
<body>
  <h2>Upload an Image for Prediction</h2>
  <input type="file" id="fileInput">
  <button onclick="predictDisease()">Predict</button>
  <p id="result"></p>

  <script>
    async function predictDisease() {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files[0]) {
        alert('Please select an image first!');
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      const response = await fetch('https://skin-disease-ai-8ypl.onrender.com/predict', {
        method: 'POST',
        body: formData
      });

      const result = await response.json();
      document.getElementById('result').textContent =
        `Prediction: ${result.prediction || 'Error detecting disease'}`;
    }
  </script>
</body>
</html>
